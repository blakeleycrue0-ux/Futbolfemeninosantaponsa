<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso club — Fútbol Femenino Santa Ponça</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
<div class="admin-login-shell">
  <div class="admin-login-card">
    <div class="brand" style="margin-bottom:1.6rem;color:var(--text-on-cream);">
      <img class="brand__crest" src="../assets/img/escudo-santa-ponsa.png" alt="Escudo Fútbol Femenino Santa Ponça">
      <span class="brand__name" style="color:var(--text-on-cream);">Fútbol Femenino<small style="color:var(--text-on-cream-muted);">Santa Ponça · Panel</small></span>
    </div>
    <h1 style="font-size:1.3rem;">Acceso del club</h1>
    <p style="font-size:0.86rem;">Entra con la cuenta de administración para gestionar noticias, plantilla, resultados y galería.</p>
    <div class="form-error" id="login-error"></div>
    <form id="login-form">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
    <div class="form-success" id="reset-sent" style="display:none;"></div>
    <p class="form-note" style="margin-top:1rem;"><a href="#" id="forgot-link">¿Has olvidado la contraseña?</a></p>
    <p class="form-note"><a href="../index.html">← Volver a la web</a></p>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  errorEl.style.display = "none";

  if (!window.spfc) {
    errorEl.textContent = "Supabase no está configurado en esta web.";
    errorEl.style.display = "block";
    return;
  }

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  btn.disabled = true;
  btn.textContent = "Entrando…";

  const { error } = await window.spfc.auth.signInWithPassword({ email, password });

  if (error) {
    errorEl.textContent = "No se ha podido iniciar sesión: " + error.message;
    errorEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Entrar";
    return;
  }

  location.href = "dashboard.html";
});

document.getElementById("forgot-link").addEventListener("click", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("login-error");
  const sentEl = document.getElementById("reset-sent");
  errorEl.style.display = "none";
  sentEl.style.display = "none";

  if (!window.spfc) {
    errorEl.textContent = "Supabase no está configurado en esta web.";
    errorEl.style.display = "block";
    return;
  }

  const email = document.getElementById("email").value.trim();
  if (!email) {
    errorEl.textContent = "Escribe primero tu email arriba y luego pulsa en \"¿Has olvidado la contraseña?\".";
    errorEl.style.display = "block";
    return;
  }

  const { error } = await window.spfc.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname.replace(/index\.html$/, "") + "restablecer.html",
  });

  if (error) {
    errorEl.textContent = "No se ha podido enviar el email: " + error.message;
    errorEl.style.display = "block";
    return;
  }

  sentEl.textContent = "Te hemos enviado un email a " + email + " con un enlace para elegir una contraseña nueva. Revisa también la carpeta de spam.";
  sentEl.style.display = "block";
});
</script>
</body>
</html>
