<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrocinadores — Panel club</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">
      <img class="brand__crest" src="../assets/img/escudo-santa-ponsa.png" alt="Escudo Futbol Femenino Santa Ponsa">
      <span class="brand__name">Futbol Femenino<small>Panel club</small></span>
    </div>
    <nav class="admin-nav" data-nav>
      <a href="dashboard.html">Resumen</a>
      <a href="noticias.html">Noticias</a>
      <a href="plantilla.html">Plantilla</a>
      <a href="partidos.html">Partidos</a>
      <a href="galeria.html">Galería</a>
      <a href="patrocinadores.html">Patrocinadores</a>
      <a href="inscripciones.html">Inscripciones</a>
    </nav>
    <div class="admin-sidebar-foot">
      <span data-admin-email>—</span>
      <button class="btn btn-ghost-light btn-sm btn-block" data-logout type="button">Cerrar sesión</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Patrocinadores</h1>
      <button class="btn btn-primary btn-sm" id="new-btn" type="button">Nuevo patrocinador</button>
    </div>

    <div class="admin-card admin-form-toggle" id="form-card" style="display:none;">
      <h2 id="form-title">Nuevo patrocinador</h2>
      <form id="sponsor-form">
        <input type="hidden" id="s-id">
        <div class="form-row">
          <div class="form-field"><label for="s-nombre">Nombre</label><input type="text" id="s-nombre" required></div>
          <div class="form-field"><label for="s-nivel">Nivel</label>
            <select id="s-nivel"><option value="principal">Principal</option><option value="colaborador">Colaborador</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field"><label for="s-logo">URL del logo</label><input type="url" id="s-logo" placeholder="https://…"></div>
          <div class="form-field"><label for="s-url">Enlace</label><input type="url" id="s-url" placeholder="https://…"></div>
        </div>
        <div style="display:flex;gap:0.8rem;">
          <button type="submit" class="btn btn-primary btn-sm">Guardar</button>
          <button type="button" class="btn btn-outline btn-sm" id="cancel-btn">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="admin-card">
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Nombre</th><th>Nivel</th><th>Enlace</th><th></th></tr></thead>
          <tbody id="sponsors-body"><tr><td colspan="4">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
(async function () {
  if (!window.spfc) return;
  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let sponsors = [];
  const formCard = document.getElementById("form-card");
  const form = document.getElementById("sponsor-form");

  function openForm(item) {
    form.reset();
    document.getElementById("form-title").textContent = item ? "Editar patrocinador" : "Nuevo patrocinador";
    document.getElementById("s-id").value = item ? item.id : "";
    document.getElementById("s-nombre").value = item ? item.nombre : "";
    document.getElementById("s-nivel").value = item ? item.nivel : "colaborador";
    document.getElementById("s-logo").value = item ? (item.logo_url || "") : "";
    document.getElementById("s-url").value = item ? (item.url || "") : "";
    formCard.style.display = "block";
    formCard.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("new-btn").addEventListener("click", () => openForm(null));
  document.getElementById("cancel-btn").addEventListener("click", () => (formCard.style.display = "none"));

  async function load() {
    const { data, error } = await window.spfc.from("sponsors").select("*").order("nivel").order("orden");
    const body = document.getElementById("sponsors-body");
    if (error) { body.innerHTML = `<tr><td colspan="4">Error: ${escapeHtml(error.message)}</td></tr>`; return; }
    sponsors = data || [];
    if (!sponsors.length) { body.innerHTML = '<tr><td colspan="4">Todavía no hay patrocinadores.</td></tr>'; return; }
    body.innerHTML = sponsors.map((s) => `
      <tr>
        <td>${escapeHtml(s.nombre)}</td>
        <td>${s.nivel === "principal" ? '<span class="pill">Principal</span>' : '<span class="pill pill-light" style="color:var(--text-on-cream-muted);background:var(--cream-deep);">Colaborador</span>'}</td>
        <td>${s.url ? `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.url)}</a>` : "-"}</td>
        <td class="actions">
          <button class="btn-icon" data-edit="${s.id}" type="button">✎</button>
          <button class="btn-icon danger" data-del="${s.id}" type="button">✕</button>
        </td>
      </tr>`).join("");

    body.querySelectorAll("[data-edit]").forEach((btn) =>
      btn.addEventListener("click", () => openForm(sponsors.find((s) => s.id === btn.dataset.edit))));
    body.querySelectorAll("[data-del]").forEach((btn) =>
      btn.addEventListener("click", async () => {
        if (!confirm("¿Eliminar este patrocinador?")) return;
        await window.spfc.from("sponsors").delete().eq("id", btn.dataset.del);
        load();
      }));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("s-id").value;
    const payload = {
      nombre: document.getElementById("s-nombre").value.trim(),
      nivel: document.getElementById("s-nivel").value,
      logo_url: document.getElementById("s-logo").value.trim() || null,
      url: document.getElementById("s-url").value.trim() || null,
    };
    const { error } = id
      ? await window.spfc.from("sponsors").update(payload).eq("id", id)
      : await window.spfc.from("sponsors").insert(payload);
    if (error) { alert("Error al guardar: " + error.message); return; }
    formCard.style.display = "none";
    load();
  });

  await load();
})();
</script>
</body>
</html>
