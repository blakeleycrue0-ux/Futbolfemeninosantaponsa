<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restablecer contraseña — Fútbol Femenino Santa Ponça</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">
<div class="admin-login-shell">
  <div class="admin-login-card">
    <div class="brand" style="margin-bottom:1.6rem;color:var(--text-on-cream);">
      <img class="brand__crest" src="../assets/img/escudo-santa-ponsa.png" alt="Escudo Fútbol Femenino Santa Ponça">
      <span class="brand__name" style="color:var(--text-on-cream);">Fútbol Femenino<small style="color:var(--text-on-cream-muted);">Santa Ponça · Panel</small></span>
    </div>
    <h1 style="font-size:1.3rem;">Elige una contraseña nueva</h1>
    <div id="restablecer-loading" style="font-size:0.86rem;">Comprobando el enlace…</div>
    <div class="form-error" id="restablecer-error" style="display:none;"></div>

    <form id="restablecer-form" style="display:none;">
      <div class="form-field">
        <label for="password">Contraseña nueva</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-field">
        <label for="password-confirm">Repite la contraseña</label>
        <input type="password" id="password-confirm" name="password-confirm" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="restablecer-btn">Guardar contraseña</button>
    </form>
    <p class="form-note" style="margin-top:1.2rem;"><a href="index.html">← Volver al acceso</a></p>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
(async function () {
  const loadingEl = document.getElementById("restablecer-loading");
  const errorEl = document.getElementById("restablecer-error");
  const form = document.getElementById("restablecer-form");

  function showError(msg) {
    loadingEl.style.display = "none";
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }

  if (!window.spfc) {
    showError("Supabase no está configurado en esta web.");
    return;
  }

  // El cliente de Supabase procesa el token de recuperación que llega en la
  // URL (#access_token=...) al cargar la página y dispara este evento.
  let handled = false;
  window.spfc.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY" && !handled) {
      handled = true;
      loadingEl.style.display = "none";
      form.style.display = "block";
    }
  });

  // Si el enlace ya se procesó antes de que nos suscribiéramos al evento
  // (o el usuario recarga esta misma página con una sesión de recuperación
  // ya activa), comprobamos también si ya hay sesión.
  setTimeout(async () => {
    if (handled) return;
    const { data: { session } } = await window.spfc.auth.getSession();
    if (session) {
      handled = true;
      loadingEl.style.display = "none";
      form.style.display = "block";
    } else {
      showError("Este enlace no es válido o ha caducado. Vuelve a pedir uno nuevo desde la pantalla de acceso.");
    }
  }, 1500);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    const password = document.getElementById("password").value;
    const passwordConfirm = document.getElementById("password-confirm").value;
    if (password !== passwordConfirm) {
      showError("Las dos contraseñas no coinciden.");
      form.style.display = "block";
      return;
    }

    const btn = document.getElementById("restablecer-btn");
    btn.disabled = true;
    btn.textContent = "Guardando…";

    const { error } = await window.spfc.auth.updateUser({ password });
    if (error) {
      btn.disabled = false;
      btn.textContent = "Guardar contraseña";
      showError("No se ha podido guardar: " + error.message);
      form.style.display = "block";
      return;
    }

    location.href = "dashboard.html";
  });
})();
</script>
</body>
</html>
