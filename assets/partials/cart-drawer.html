<div class="cart-drawer__scrim" id="cart-scrim"></div>
<aside class="cart-drawer" id="cart-drawer" aria-hidden="true" aria-label="Carrito de la compra">
  <div class="cart-drawer__head">
    <h2>Tu carrito</h2>
    <button type="button" class="cart-drawer__close" id="cart-close-btn" aria-label="Cerrar carrito">✕</button>
  </div>
  <div class="cart-drawer__body" id="cart-drawer-body"></div>
  <div class="cart-drawer__foot" id="cart-drawer-foot" style="display:none;">
    <div class="cart-drawer__total"><span>Subtotal</span><span id="cart-drawer-total"></span></div>
    <a href="carrito.html" class="shop-btn shop-btn--dark shop-btn--block">Ir a pagar</a>
  </div>
</aside>

<div class="shop-qv-overlay" id="shop-qv-overlay">
  <div class="shop-qv-modal">
    <button type="button" class="shop-qv-close" id="shop-qv-close" aria-label="Cerrar vista rápida">✕</button>
    <div id="shop-qv-body" style="display:contents;"></div>
  </div>
</div>
