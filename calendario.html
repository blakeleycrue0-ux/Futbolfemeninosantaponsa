<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario — Fútbol Femenino Santa Ponça</title>
<meta name="description" content="Calendario completo del Fútbol Femenino Santa Ponça: próximos partidos y resultados de todas las categorías del club.">
<link rel="canonical" href="https://futbolfemeninosantaponsa.netlify.app/calendario.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Calendario — Fútbol Femenino Santa Ponça">
<meta property="og:description" content="Próximos partidos y resultados de todas las categorías del club.">
<meta property="og:url" content="https://futbolfemeninosantaponsa.netlify.app/calendario.html">
<meta property="og:locale" content="es_ES">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .filters-bar label { font-size: 0.8rem; font-weight: 600; align-self: center; color: var(--text-on-cream-muted); }
  .cal-group + .cal-group { margin-top: 2.2rem; }
  .cal-group__title {
    font-family: var(--font-display); font-weight: 800; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent-dark); margin: 0 0 1rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--accent-dark);
  }
  .section-dark .cal-group__title { color: var(--accent-light); border-bottom-color: var(--accent-light); }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">

  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag">Temporada 2025/26</span>
      <h1 class="hero__title">Calendario</h1>
    </div>
  </section>

  <section class="section section-dark" id="protagonista-section" aria-labelledby="protagonista-heading" style="display:none;">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Próximo partido</span>
          <h2 id="protagonista-heading" style="color:var(--text-on-dark);">A por los tres puntos</h2>
        </div>
      </div>
      <div id="protagonista-match" style="max-width:660px;margin:0 auto;"></div>
    </div>
  </section>

  <section class="section" aria-labelledby="proximos-heading">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Calendario</span>
          <h2 id="proximos-heading">Todos los próximos partidos</h2>
        </div>
      </div>

      <div class="filters-bar">
        <label for="filtro-equipo">Equipo</label>
        <select id="filtro-equipo" aria-label="Filtrar por equipo">
          <option value="">Cargando equipos…</option>
        </select>
        <label for="filtro-estado">Estado</label>
        <select id="filtro-estado" aria-label="Filtrar por estado">
          <option value="todos">Todos los partidos</option>
          <option value="proximos">Solo próximos</option>
          <option value="jugados">Solo jugados</option>
        </select>
      </div>

      <div id="proximos-grid" class="grid grid-3">
        <p class="empty-state" style="grid-column:1/-1;">Cargando partidos…</p>
      </div>
    </div>
  </section>

  <section class="section section-dark" id="resultados-section" aria-labelledby="resultados-heading">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Histórico</span>
          <h2 id="resultados-heading">Resultados</h2>
        </div>
      </div>
      <div id="resultados-grid" class="grid grid-3">
        <p class="empty-state" style="grid-column:1/-1;">Cargando resultados…</p>
      </div>
    </div>
  </section>

</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const teamSelect = document.getElementById("filtro-equipo");
  const estadoSelect = document.getElementById("filtro-estado");
  const proximosGrid = document.getElementById("proximos-grid");
  const resultadosGrid = document.getElementById("resultados-grid");
  const resultadosSection = document.getElementById("resultados-section");
  const protagonistaSection = document.getElementById("protagonista-section");
  const protagonistaMatch = document.getElementById("protagonista-match");
  const crestHtml = spfcMatchCrest;
  let liveRefreshTimer = null;
  let teams = [];

  // Agrupa una lista de partidos por equipo, en el mismo orden que ya usan
  // "Equipos"/admin (teams.orden) — así nunca se ven mezclados partidos de
  // categorías distintas (3ª RFEF, Regional, Cadete…) cuando se ven todos
  // los equipos a la vez. Si la lista ya es de un solo equipo (se ha usado
  // el filtro de arriba) no hace falta ningún título de grupo.
  function agruparPorEquipo(list) {
    const porTeamId = new Map();
    list.forEach((m) => {
      const key = m.team_id || "—";
      if (!porTeamId.has(key)) porTeamId.set(key, { team: m.teams || null, matches: [] });
      porTeamId.get(key).matches.push(m);
    });
    // Mismo orden que "teams" (teams.orden), no el orden en que aparecen
    // cronológicamente — así un partido de Regional que caiga antes en el
    // calendario no "adelanta" a su grupo por delante de 3ª RFEF.
    const ordenados = teams.map((t) => porTeamId.get(t.id)).filter(Boolean);
    const sinEquipo = porTeamId.get("—");
    if (sinEquipo) ordenados.push(sinEquipo);
    return ordenados;
  }

  function tituloEquipo(team) {
    if (!team) return "";
    return team.nombre + (team.categoria ? " · " + team.categoria : "");
  }

  function renderProximos(list) {
    if (!list.length) {
      proximosGrid.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">No hay próximos partidos programados por ahora.</p>`;
      return;
    }
    const grupos = agruparPorEquipo(list);
    if (grupos.length > 1) {
      proximosGrid.innerHTML = grupos.map((g) => `
        <div class="cal-group">
          <p class="cal-group__title">${tituloEquipo(g.team)}</p>
          <div class="grid grid-3">${matchCardsProximos(g.matches)}</div>
        </div>`).join("");
      return;
    }
    proximosGrid.innerHTML = matchCardsProximos(list);
  }

  function matchCardsProximos(list) {
    return list.map((m) => {
      const esLocal = m.condicion === "local";
      const enVivo = spfcEsEnVivo(m);
      return `
      <div class="match-card">
        <span class="match-card__comp">${m.teams && m.teams.categoria ? m.teams.categoria + " · " : ""}${m.tipo && m.tipo !== "Liga" ? m.tipo + " · " : ""}${m.competicion || ""}${m.jornada ? " · Jornada " + m.jornada : ""}</span>
        <div class="match-card__teams">
          <div class="match-team">
            <span class="match-team__crest">${crestHtml(esLocal, m.rival, m.rival_escudo_url)}</span>
            <span class="match-team__name">${esLocal ? "Santa Ponça" : (m.rival || "")}</span>
          </div>
          ${enVivo ? `<span class="match-card__live">En vivo</span>` : `<span class="match-card__vs">VS</span>`}
          <div class="match-team">
            <span class="match-team__crest">${crestHtml(!esLocal, m.rival, m.rival_escudo_url)}</span>
            <span class="match-team__name">${esLocal ? (m.rival || "") : "Santa Ponça"}</span>
          </div>
        </div>
        <div class="match-card__meta">
          <span>${enVivo ? "Jugándose ahora mismo" : spfcFormatDate(m.fecha, { weekday: "long", day: "2-digit", month: "long" }) + (m.hora ? " · " + m.hora.slice(0, 5) + "h" : "")}</span>
          <span>${m.campo || ""}</span>
        </div>
      </div>`;
    }).join("");
  }

  function renderResultados(list) {
    if (!list.length) {
      resultadosGrid.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">Todavía no hay resultados registrados.</p>`;
      return;
    }
    const grupos = agruparPorEquipo(list);
    if (grupos.length > 1) {
      resultadosGrid.innerHTML = grupos.map((g) => `
        <div class="cal-group">
          <p class="cal-group__title">${tituloEquipo(g.team)}</p>
          <div class="grid grid-3">${matchCardsResultados(g.matches)}</div>
        </div>`).join("");
      return;
    }
    resultadosGrid.innerHTML = matchCardsResultados(list);
  }

  function matchCardsResultados(list) {
    return list.map((m) => {
      const esLocal = m.condicion === "local";
      const res = spfcResultLabel(m);
      const resLabel = res === "W" ? "Victoria" : res === "L" ? "Derrota" : "Empate";
      return `
      <a href="partido.html?id=${encodeURIComponent(m.id)}" class="match-card">
        <span class="match-card__comp">${m.teams && m.teams.categoria ? m.teams.categoria + " · " : ""}${m.tipo && m.tipo !== "Liga" ? m.tipo + " · " : ""}${m.competicion || ""}${m.jornada ? " · Jornada " + m.jornada : ""}</span>
        <div class="match-card__teams">
          <div class="match-team">
            <span class="match-team__crest">${crestHtml(esLocal, m.rival, m.rival_escudo_url)}</span>
            <span class="match-team__name">${esLocal ? "Santa Ponça" : (m.rival || "")}</span>
          </div>
          <span class="match-card__score">${esLocal ? m.goles_equipo : m.goles_rival} — ${esLocal ? m.goles_rival : m.goles_equipo}</span>
          <div class="match-team">
            <span class="match-team__crest">${crestHtml(!esLocal, m.rival, m.rival_escudo_url)}</span>
            <span class="match-team__name">${esLocal ? (m.rival || "") : "Santa Ponça"}</span>
          </div>
        </div>
        <div class="match-card__meta">
          <span>${spfcFormatDate(m.fecha)}</span>
          <span class="match-card__result result-${res}">${resLabel}</span>
        </div>
      </a>`;
    }).join("");
  }

  function applyEstadoFilter() {
    const val = estadoSelect.value;
    document.getElementById("proximos-heading").closest("section").style.display = val === "jugados" ? "none" : "";
    resultadosSection.style.display = val === "proximos" ? "none" : "";
    protagonistaSection.style.display = (val === "jugados" || !protagonistaMatch.innerHTML) ? "none" : "";
  }

  async function loadAndRender(teamId) {
    proximosGrid.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">Cargando partidos…</p>`;
    resultadosGrid.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">Cargando resultados…</p>`;
    protagonistaMatch.innerHTML = "";
    const all = await SPFC_DATA.allMatches(teamId);
    const list = Array.isArray(all) ? all : [];
    const proximosTodos = list.filter((m) => m.estado === "programado").sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
    const jugados = list.filter((m) => m.estado === "jugado").sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
    const proximos = spfcProximoPorEquipo(proximosTodos);
    renderProximos(proximos);
    renderResultados(jugados);
    if (proximos.length) {
      protagonistaMatch.innerHTML = spfcMatchProtagonistHTML(proximos[0]);
    }
    applyEstadoFilter();

    // Repinta cada minuto para que un partido pase a "En vivo" solo,
    // en cuanto llega su hora, sin recargar la página ni pedir datos otra vez.
    // También hace que, pasadas un par de horas de un partido sin marcar
    // como jugado, deje de mostrarse y aparezca en su lugar el siguiente
    // de ese mismo equipo — para no enseñar de golpe toda la temporada.
    if (liveRefreshTimer) clearInterval(liveRefreshTimer);
    liveRefreshTimer = setInterval(() => {
      const proximosAhora = spfcProximoPorEquipo(proximosTodos);
      renderProximos(proximosAhora);
      if (proximosAhora.length) protagonistaMatch.innerHTML = spfcMatchProtagonistHTML(proximosAhora[0]);
    }, 60000);
  }

  try {
    teams = await SPFC_DATA.teams();
    const paramTeam = new URLSearchParams(location.search).get("team");
    let currentTeamId = "";

    if (teams && teams.length) {
      const opciones = [`<option value="">Todos los equipos</option>`]
        .concat(teams.map((t) => `<option value="${t.id}">${t.nombre}${t.categoria ? " · " + t.categoria : ""}</option>`));
      teamSelect.innerHTML = opciones.join("");
      const match = paramTeam && teams.find((t) => t.id === paramTeam);
      currentTeamId = match ? match.id : "";
      teamSelect.value = currentTeamId;
    } else {
      teamSelect.innerHTML = `<option value="">Todos los equipos</option>`;
    }

    teamSelect.addEventListener("change", () => {
      currentTeamId = teamSelect.value;
      const url = new URL(location.href);
      if (currentTeamId) url.searchParams.set("team", currentTeamId);
      else url.searchParams.delete("team");
      history.replaceState(null, "", url);
      loadAndRender(currentTeamId);
    });

    estadoSelect.addEventListener("change", applyEstadoFilter);
    applyEstadoFilter();
    await loadAndRender(currentTeamId);
  } catch (err) {
    console.warn("[calendario] error cargando datos:", err);
    proximosGrid.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">No se han podido cargar los partidos.</p>`;
    resultadosGrid.innerHTML = "";
  }
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
