<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago — Fútbol Femenino Santa Ponça</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .co-wrap { max-width: 520px; margin: 0 auto; background: var(--paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 2.2rem; text-align: center; }
  @media (max-width: 620px) { .co-wrap { padding: 1.6rem; } }
  .co-nombre { font-family: var(--font-display); font-size: 1.3rem; font-weight: 900; margin: 0.6rem 0 0.2rem; }
  .co-precio { font-family: var(--font-display); font-size: 2.6rem; font-weight: 900; color: var(--accent-dark); margin: 0.6rem 0; }
  .co-meta { color: var(--text-on-cream-muted); font-size: 0.9rem; margin-bottom: 1.4rem; }
  .co-note { background: var(--cream-deep); border-radius: var(--radius-md); padding: 0.9rem 1.1rem; font-size: 0.84rem; margin-top: 1rem; text-align: left; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">
  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag">Fútbol Femenino Santa Ponça</span>
      <h1 class="hero__title">Pago</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="co-wrap">
        <div id="co-loading">Cargando…</div>
        <div id="co-content" style="display:none;">
          <span class="eyebrow" id="co-tipo"></span>
          <div class="co-nombre" id="co-nombre"></div>
          <p class="co-meta" id="co-descripcion"></p>
          <div class="co-precio" id="co-precio"></div>
          <div id="co-cancelado" class="co-note" style="display:none;background:rgba(239,68,68,0.1);">
            El pago anterior se canceló — no se te ha cobrado nada. Puedes intentarlo otra vez.
          </div>
          <button type="button" class="btn btn-primary btn-block" id="co-pagar-btn">Pagar con tarjeta (Stripe)</button>
          <p id="co-status" style="margin-top:1rem;font-size:0.86rem;"></p>
          <div class="co-note">Pago seguro gestionado por Stripe. No guardamos tu tarjeta en ningún momento.</div>
        </div>
        <div id="co-error" class="form-error" style="display:none;"></div>
      </div>
    </div>
  </section>
</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/ticketing-data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const loadingEl = document.getElementById("co-loading");
  const contentEl = document.getElementById("co-content");
  const errorEl = document.getElementById("co-error");
  const params = new URLSearchParams(location.search);
  const productoId = params.get("producto");

  function mostrarError(msg) {
    loadingEl.style.display = "none";
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }

  if (!window.spfc) { mostrarError("La compra no está disponible ahora mismo."); return; }
  if (!productoId) { mostrarError("Falta elegir un producto."); return; }

  const sesion = await SPFC_TICKETING.sesionActual();
  if (!sesion) {
    const volver = encodeURIComponent(location.pathname + location.search);
    location.href = `cuenta.html?volver=${volver}`;
    return;
  }

  const producto = await SPFC_TICKETING.producto(productoId);
  if (!producto || !producto.activo) { mostrarError("Ese producto no existe o ya no está a la venta."); return; }

  document.getElementById("co-tipo").textContent = SPFC_TICKETING.nombreTipo(producto.tipo);
  document.getElementById("co-nombre").textContent = producto.nombre;
  document.getElementById("co-descripcion").textContent = producto.descripcion || "";
  document.getElementById("co-precio").textContent = SPFC_TICKETING.fmtEuros(producto.precio);
  if (params.get("cancelado")) document.getElementById("co-cancelado").style.display = "block";

  loadingEl.style.display = "none";
  contentEl.style.display = "block";

  document.getElementById("co-pagar-btn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const status = document.getElementById("co-status");
    btn.disabled = true;
    status.textContent = "Conectando con Stripe…";
    try {
      const { url } = await SPFC_TICKETING.iniciarCheckout(producto.id);
      location.href = url;
    } catch (err) {
      status.textContent = "Error: " + err.message;
      btn.disabled = false;
    }
  });
})();
</script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
