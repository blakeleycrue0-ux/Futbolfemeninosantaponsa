<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta — Fútbol Femenino Santa Ponça</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .cta-wrap { max-width: 440px; margin: 0 auto; }
  .cta-card { background: var(--paper); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 2.2rem; }
  @media (max-width: 620px) { .cta-card { padding: 1.6rem; } }
  .cta-tabs { display: flex; gap: 0.4rem; margin-bottom: 1.6rem; }
  .cta-tab {
    flex: 1; text-align: center; padding: 0.7rem; border-radius: var(--radius-md); border: 1px solid rgba(10,10,10,0.14);
    background: transparent; font-weight: 700; font-size: 0.86rem; cursor: pointer; color: var(--text-on-cream-muted);
  }
  .cta-tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .cta-form { display: none; }
  .cta-form.active { display: block; }
  .cta-sesion { text-align: center; }
  .cta-sesion .socios-candado { border: none; padding: 0; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-cuenta-->
<main id="main">
  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag">Fútbol Femenino Santa Ponça</span>
      <h1 class="hero__title">Mi cuenta</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="cta-wrap">
        <div id="cta-cargando" class="cta-card" style="text-align:center;">Cargando…</div>

        <div id="cta-sesion" class="cta-card cta-sesion" style="display:none;">
          <p style="margin-top:0;">Sesión iniciada como<br><strong id="cta-email"></strong></p>
          <a class="btn btn-outline btn-sm" id="cta-volver-link" href="index.html">Volver a la web</a>
          <button type="button" class="btn btn-outline btn-sm" id="cta-logout-btn" style="margin-left:0.6rem;">Cerrar sesión</button>
        </div>

        <div id="cta-formularios" class="cta-card" style="display:none;">
          <div class="cta-tabs">
            <button type="button" class="cta-tab active" id="tab-entrar">Iniciar sesión</button>
            <button type="button" class="cta-tab" id="tab-crear">Crear cuenta</button>
          </div>

          <div class="form-error" id="cta-error" style="display:none;"></div>
          <div class="form-success" id="cta-success" style="display:none;"></div>

          <form id="form-entrar" class="cta-form active">
            <div class="form-field">
              <label for="entrar-email">Email</label>
              <input type="email" id="entrar-email" required autocomplete="username">
            </div>
            <div class="form-field">
              <label for="entrar-password">Contraseña</label>
              <input type="password" id="entrar-password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="entrar-btn">Entrar</button>
            <p class="form-note" style="margin-top:1rem;"><a href="#" id="olvide-link">¿Has olvidado la contraseña?</a></p>
          </form>

          <form id="form-crear" class="cta-form">
            <div class="form-field">
              <label for="crear-nombre">Nombre</label>
              <input type="text" id="crear-nombre" required autocomplete="name">
            </div>
            <div class="form-field">
              <label for="crear-email">Email</label>
              <input type="email" id="crear-email" required autocomplete="email">
            </div>
            <div class="form-field">
              <label for="crear-password">Contraseña</label>
              <input type="password" id="crear-password" required minlength="6" autocomplete="new-password">
              <p class="form-note">Mínimo 6 caracteres.</p>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="crear-btn">Crear cuenta</button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const volver = params.get("volver") ? decodeURIComponent(params.get("volver")) : "index.html";
  document.getElementById("cta-volver-link").href = volver;

  const cargandoEl = document.getElementById("cta-cargando");
  const sesionEl = document.getElementById("cta-sesion");
  const formulariosEl = document.getElementById("cta-formularios");

  if (!window.spfc) {
    cargandoEl.textContent = "La web no está configurada para cuentas de socias todavía.";
    return;
  }

  const { data: { session } } = await window.spfc.auth.getSession();
  cargandoEl.style.display = "none";

  if (session) {
    document.getElementById("cta-email").textContent = session.user.email;
    sesionEl.style.display = "block";
    document.getElementById("cta-logout-btn").addEventListener("click", async () => {
      await window.spfc.auth.signOut();
      location.reload();
    });
    return;
  }

  formulariosEl.style.display = "block";

  const tabEntrar = document.getElementById("tab-entrar");
  const tabCrear = document.getElementById("tab-crear");
  const formEntrar = document.getElementById("form-entrar");
  const formCrear = document.getElementById("form-crear");
  const errorEl = document.getElementById("cta-error");
  const successEl = document.getElementById("cta-success");

  function mostrarTab(tab) {
    errorEl.style.display = "none";
    successEl.style.display = "none";
    tabEntrar.classList.toggle("active", tab === "entrar");
    tabCrear.classList.toggle("active", tab === "crear");
    formEntrar.classList.toggle("active", tab === "entrar");
    formCrear.classList.toggle("active", tab === "crear");
  }
  tabEntrar.addEventListener("click", () => mostrarTab("entrar"));
  tabCrear.addEventListener("click", () => mostrarTab("crear"));
  if (params.get("crear") === "1") mostrarTab("crear");

  formEntrar.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    const btn = document.getElementById("entrar-btn");
    btn.disabled = true;
    btn.textContent = "Entrando…";

    const { error } = await window.spfc.auth.signInWithPassword({
      email: document.getElementById("entrar-email").value.trim(),
      password: document.getElementById("entrar-password").value,
    });

    if (error) {
      errorEl.textContent = "No se ha podido iniciar sesión: " + error.message;
      errorEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }
    location.href = volver;
  });

  document.getElementById("olvide-link").addEventListener("click", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    successEl.style.display = "none";
    const email = document.getElementById("entrar-email").value.trim();
    if (!email) {
      errorEl.textContent = "Escribe primero tu email arriba y pulsa de nuevo en este enlace.";
      errorEl.style.display = "block";
      return;
    }
    const { error } = await window.spfc.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + "/restablecer-cuenta.html",
    });
    if (error) {
      errorEl.textContent = "No se ha podido enviar el email: " + error.message;
      errorEl.style.display = "block";
      return;
    }
    successEl.textContent = "Te hemos enviado un email a " + email + " con un enlace para elegir una contraseña nueva.";
    successEl.style.display = "block";
  });

  formCrear.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    successEl.style.display = "none";
    const btn = document.getElementById("crear-btn");
    btn.disabled = true;
    btn.textContent = "Creando…";

    const { data, error } = await window.spfc.auth.signUp({
      email: document.getElementById("crear-email").value.trim(),
      password: document.getElementById("crear-password").value,
      options: { data: { nombre: document.getElementById("crear-nombre").value.trim() } },
    });

    if (error) {
      errorEl.textContent = "No se ha podido crear la cuenta: " + error.message;
      errorEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Crear cuenta";
      return;
    }

    if (data.session) {
      location.href = volver;
      return;
    }

    formCrear.style.display = "none";
    tabEntrar.parentElement.style.display = "none";
    successEl.textContent = "¡Ya casi está! Te hemos enviado un email para confirmar tu cuenta — revisa también la carpeta de spam.";
    successEl.style.display = "block";
  });
})();
</script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
