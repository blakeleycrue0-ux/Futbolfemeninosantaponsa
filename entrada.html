<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi entrada — Fútbol Femenino Santa Ponça</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/ticketing.css">
<style>
  .et-wrap { max-width: 440px; margin: 0 auto; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-cuenta-->
<main id="main" class="tk-page">
  <div class="container et-wrap">
    <div id="mc-loading" class="tk-empty">Cargando…</div>

    <div id="mc-content" style="display:none;">
      <div class="ticket-hero">
        <div class="ticket-hero__top">
          <div class="ticket-hero__teams">FFSP<span class="vs">vs</span><span id="mc-rival"></span></div>
          <div class="ticket-hero__when" id="mc-meta"></div>
        </div>
        <div class="ticket-hero__stub">
          <div class="ticket-hero__tipo">Entrada general</div>
          <div id="mc-cancelada" style="display:none;color:var(--loss);font-weight:700;font-size:0.86rem;margin-top:0.6rem;">Esta entrada ha sido cancelada</div>
          <div id="mc-qr-toggle-wrap" class="qr-toggle-wrap">
            <button type="button" class="tk-btn tk-btn--dark" id="mc-qr-toggle">Mostrar QR</button>
          </div>
          <div class="qr-panel" id="mc-qr-panel">
            <div class="qr-panel__box" id="mc-qr"></div>
            <div class="qr-panel__hint">Presenta este código en el acceso.</div>
          </div>
        </div>
      </div>
    </div>
    <div id="mc-error" class="tk-empty" style="display:none;"></div>
  </div>
</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/ticketing-data.js"></script>
<script src="assets/js/qr.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id");
  if (!window.spfc) return;
  const sesion = await SPFC_TICKETING.sesionActual();
  if (!sesion) {
    location.href = "cuenta.html?volver=" + encodeURIComponent(location.pathname + location.search);
    return;
  }

  const loadingEl = document.getElementById("mc-loading");
  const errorEl = document.getElementById("mc-error");

  if (!id) { loadingEl.style.display = "none"; errorEl.textContent = "Falta el id de la entrada."; errorEl.style.display = "block"; return; }

  const { data: ticket } = await window.spfc.from("tickets").select("*, matches(rival, fecha, hora, campo)").eq("id", id).single();
  if (!ticket) {
    loadingEl.style.display = "none";
    errorEl.textContent = "No se ha encontrado esa entrada, o no es tuya.";
    errorEl.style.display = "block";
    return;
  }

  document.getElementById("mc-rival").textContent = ticket.matches.rival;
  document.getElementById("mc-meta").textContent = SPFC_TICKETING.fmtFecha(ticket.matches.fecha) + (ticket.matches.hora ? " · " + ticket.matches.hora.slice(0, 5) + "h" : "") + (ticket.matches.campo ? " · " + ticket.matches.campo : "");

  let token = null;
  if (ticket.estado !== "valido") {
    document.getElementById("mc-cancelada").style.display = "block";
    document.getElementById("mc-qr-toggle-wrap").style.display = "none";
  } else {
    token = await SPFC_TICKETING.credencialDeTicket(ticket.id);
    document.getElementById("mc-qr-toggle").addEventListener("click", (e) => {
      const panel = document.getElementById("mc-qr-panel");
      const abriendo = !panel.classList.contains("is-open");
      panel.classList.toggle("is-open", abriendo);
      e.currentTarget.textContent = abriendo ? "Ocultar QR" : "Mostrar QR";
      if (abriendo && !panel.dataset.rendered && token) {
        SPFC_QR.render(document.getElementById("mc-qr"), token);
        panel.dataset.rendered = "1";
      }
    });
  }

  loadingEl.style.display = "none";
  document.getElementById("mc-content").style.display = "block";
})();
</script>
</body>
</html>
