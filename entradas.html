<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entradas — Fútbol Femenino Santa Ponça</title>
<meta name="description" content="Compra tu abono de temporada o la entrada de un partido concreto del Fútbol Femenino Santa Ponça.">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .tk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.2rem; margin-top: 1.4rem; }
  .tk-card { background: var(--paper); border: 1px solid rgba(10,10,10,0.12); border-radius: var(--radius-lg); padding: 1.6rem; display: flex; flex-direction: column; }
  .tk-card h3 { font-family: var(--font-display); font-size: 1.1rem; margin: 0 0 0.4rem; }
  .tk-card p { font-size: 0.9rem; color: var(--text-on-cream-muted); flex-grow: 1; }
  .tk-card .tk-meta { font-size: 0.8rem; color: var(--text-on-cream-muted); margin-bottom: 0.4rem; }
  .tk-price { font-family: var(--font-display); font-weight: 900; font-size: 1.8rem; color: var(--accent-dark); margin: 0.6rem 0; }
  .tk-empty { color: var(--text-on-cream-muted); }
  .tk-section-title { margin-top: 2.4rem; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">
  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag">Fútbol Femenino Santa Ponça</span>
      <h1 class="hero__title">Entradas</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Abonos</span>
          <h2 class="tk-section-title">Abono de temporada</h2>
        </div>
      </div>
      <div id="tk-grid-abonos" class="tk-grid"><p class="tk-empty">Cargando…</p></div>

      <div class="section-head">
        <div>
          <span class="eyebrow">Partido a partido</span>
          <h2 class="tk-section-title">Entradas sueltas</h2>
        </div>
      </div>
      <div id="tk-grid-entradas" class="tk-grid"><p class="tk-empty">Cargando…</p></div>
    </div>
  </section>
</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/ticketing-data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const gridAbonos = document.getElementById("tk-grid-abonos");
  const gridEntradas = document.getElementById("tk-grid-entradas");
  if (!window.spfc) {
    gridAbonos.innerHTML = gridEntradas.innerHTML = '<p class="tk-empty">La venta de entradas no está disponible ahora mismo.</p>';
    return;
  }

  function cardHtml(p) {
    const partido = p.matches ? `<div class="tk-meta">vs ${p.matches.rival} — ${SPFC_TICKETING.fmtFecha(p.matches.fecha)}</div>` : "";
    const equipo = p.teams ? `<div class="tk-meta">${p.teams.nombre}</div>` : "";
    return `
    <div class="tk-card">
      ${partido}${equipo}
      <h3>${p.nombre}</h3>
      <p>${p.descripcion || ""}</p>
      <div class="tk-price">${SPFC_TICKETING.fmtEuros(p.precio)}</div>
      ${p.capacity != null ? `<p class="tk-meta">${Math.max(p.capacity - (p.capacity_sold || 0), 0)} entradas disponibles</p>` : ""}
      <a class="btn btn-primary btn-block" href="checkout.html?producto=${p.id}">Comprar</a>
    </div>`;
  }

  const abonos = await SPFC_TICKETING.productosActivos(["abono"]);
  gridAbonos.innerHTML = abonos.length ? abonos.map(cardHtml).join("") : '<p class="tk-empty">Todavía no hay ningún abono a la venta.</p>';

  const entradas = (await SPFC_TICKETING.productosActivos(["entrada"])).filter((p) => p.capacity == null || p.capacity_sold < p.capacity);
  gridEntradas.innerHTML = entradas.length ? entradas.map(cardHtml).join("") : '<p class="tk-empty">Todavía no hay entradas de partido a la venta.</p>';
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
