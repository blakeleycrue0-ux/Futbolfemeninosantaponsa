<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entradas — Fútbol Femenino Santa Ponça</title>
<meta name="description" content="Compra tu abono de temporada o la entrada de un partido concreto del Fútbol Femenino Santa Ponça.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/ticketing.css">
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main" class="tk-page">
  <div class="container tk-two-col">
    <div class="tk-pagehead">
      <span class="tk-eyebrow">Entradas</span>
      <h1>Próximos partidos en casa.</h1>
      <div id="tk-abonos" style="margin-top:1.2rem;"></div>
    </div>

    <div>
      <div class="hub-section__head">
        <h2>Entradas</h2>
      </div>
      <div class="fixture-list" id="tk-fixtures">
        <p class="tk-empty">Cargando…</p>
      </div>
    </div>
  </div>
</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/ticketing-data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const abonosEl = document.getElementById("tk-abonos");
  const fixturesEl = document.getElementById("tk-fixtures");
  if (!window.spfc) {
    fixturesEl.innerHTML = '<p class="tk-empty">La venta de entradas no está disponible ahora mismo.</p>';
    return;
  }
  const esc = SPFC_TICKETING.escapeHtml;

  const abonos = await SPFC_TICKETING.productosActivos(["abono"]);
  abonosEl.innerHTML = abonos.length ? abonos.map((p) => `
    <div class="membership-product">
      <div class="membership-product__kicker">ABONO <span>${esc((p.temporada || "").replace("20", ""))}</span></div>
      <p class="membership-product__temporada">${esc(p.teams ? p.teams.nombre : "Todo el club")} · Temporada completa</p>
      <div class="membership-product__price-row">
        <div class="membership-product__price">${SPFC_TICKETING.fmtEuros(p.precio)}<small>${esc(p.nombre)}</small></div>
        <a class="tk-btn tk-btn--dark" href="checkout.html?producto=${p.id}">Comprar abono</a>
      </div>
    </div>`).join("") : "";

  const entradas = (await SPFC_TICKETING.productosActivos(["entrada"])).filter((p) => p.capacity == null || p.capacity_sold < p.capacity);
  if (!entradas.length) {
    fixturesEl.innerHTML = '<p class="tk-empty">Todavía no hay entradas de partido a la venta.</p>';
    return;
  }
  fixturesEl.innerHTML = entradas.map((p) => {
    const m = p.matches || {};
    const teams = `FFSP <span style="color:var(--text-on-cream-muted);font-weight:400;">vs</span> ${esc(m.rival || "")}`;
    const meta = [p.teams ? p.teams.nombre : null, m.hora ? m.hora.slice(0, 5) + "h" : null].filter(Boolean).join(" · ");
    return SPFC_TICKETING.fixtureRowHTML({
      href: `checkout.html?producto=${p.id}`,
      dow: SPFC_TICKETING.fmtDow(m.fecha),
      dom: SPFC_TICKETING.fmtFechaCorta(m.fecha),
      teams,
      meta,
      priceLabel: "Desde " + SPFC_TICKETING.fmtEuros(p.precio),
      ctaLabel: "Comprar →",
    });
  }).join("");
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
