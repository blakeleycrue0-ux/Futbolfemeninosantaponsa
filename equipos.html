<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipos — Fútbol Femenino Santa Ponça</title>
<meta name="description" content="Todas las categorías del Fútbol Femenino Santa Ponça: 3ª RFEF, Regional, cadete, infantil y alevín. Consulta cada plantilla del club.">
<link rel="canonical" href="https://futbolfemeninosantaponsa.netlify.app/equipos.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Equipos — Fútbol Femenino Santa Ponça">
<meta property="og:description" content="Todas las categorías del club: 3ª RFEF, Regional, cadete, infantil y alevín.">
<meta property="og:url" content="https://futbolfemeninosantaponsa.netlify.app/equipos.html">
<meta property="og:locale" content="es_ES">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">

  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag">Club Fútbol Femenino Santa Ponça</span>
      <h1 class="hero__title">Nuestros equipos</h1>
    </div>
  </section>

  <section class="section" aria-labelledby="equipos-heading">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Categorías</span>
          <h2 id="equipos-heading">Equipos del club</h2>
        </div>
      </div>
      <div id="equipos-grid" class="grid grid-3">
        <p class="empty-state">Cargando equipos…</p>
      </div>
    </div>
  </section>

</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const grid = document.getElementById("equipos-grid");
  const teams = await SPFC_DATA.teams();

  if (!teams || !teams.length) {
    grid.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">Todavía no hay equipos publicados.</p>`;
    return;
  }

  grid.innerHTML = teams.map((t) => `
    <div class="card">
      <div class="card__body">
        <span class="card__tag">${t.categoria || ""}</span>
        <h3 class="card__title">${t.nombre || ""}</h3>
        <p class="card__meta">Temporada ${t.temporada || ""}</p>
        <a href="plantilla.html?team=${encodeURIComponent(t.id)}" class="btn btn-outline btn-sm" style="margin-top:1.2rem;">Ver plantilla</a>
      </div>
    </div>`).join("");
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
