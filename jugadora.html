<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Jugadora — Fútbol Femenino Santa Ponça</title>
<meta name="description" id="page-description" content="Ficha de jugadora del Fútbol Femenino Santa Ponça: dorsal, posición, estadísticas y biografía.">
<link rel="canonical" href="https://futbolfemeninosantaponsa.netlify.app/jugadora.html">
<meta property="og:type" content="profile">
<meta property="og:title" id="og-title" content="Jugadora — Fútbol Femenino Santa Ponça">
<meta property="og:description" id="og-description" content="Ficha de jugadora del Fútbol Femenino Santa Ponça.">
<meta property="og:url" content="https://futbolfemeninosantaponsa.netlify.app/jugadora.html">
<meta property="og:locale" content="es_ES">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .player-profile--photo {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 2.5rem;
    align-items: start;
  }
  @media (max-width: 780px) {
    .player-profile--photo { grid-template-columns: 1fr; }
  }
  .player-profile__photo {
    aspect-ratio: 3/4;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(10,10,10,0.1);
    position: relative;
    overflow: hidden;
  }
  .player-profile__photo img { width: 100%; height: 100%; object-fit: cover; }
  .player-profile__header { display: flex; align-items: center; gap: 1.1rem; }
  .player-profile__number {
    font-family: var(--font-display); font-weight: 900; font-size: 3rem; line-height: 1;
    color: var(--accent-dark);
  }
  .player-profile__pos { margin-top: 0.3em; }
  .player-profile__name { margin: 0.3em 0 1rem; }
  .player-profile__bio { color: var(--text-on-cream-muted); max-width: 60ch; margin-bottom: 2rem; }
  .player-stats-table { width: 100%; border-collapse: collapse; margin-top: 2rem; font-size: 0.9rem; }
  .player-stats-table th, .player-stats-table td { text-align: left; padding: 0.6em 0.8em; border-bottom: 1px solid rgba(10,10,10,0.08); }
  .player-stats-table th { font-weight: 700; color: var(--text-on-cream-muted); font-size: 0.8rem; text-transform: uppercase; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">

  <section class="section" aria-labelledby="jugadora-heading" style="padding-top: 7.5rem;">
    <div class="container">
      <a href="plantilla.html" class="back-link">← Volver a la plantilla</a>

      <div id="jugadora-content">
        <p class="empty-state">Cargando ficha de la jugadora…</p>
      </div>
    </div>
  </section>

</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const content = document.getElementById("jugadora-content");
  const id = new URLSearchParams(location.search).get("id");

  if (!id) {
    content.innerHTML = `
      <p class="empty-state">No se ha indicado ninguna jugadora.</p>
      <p style="text-align:center;"><a href="plantilla.html" class="btn btn-primary">Ver plantilla</a></p>`;
    return;
  }

  let player = null;
  try {
    player = await SPFC_DATA.playerById(id);
  } catch (err) {
    console.warn("[jugadora] error cargando datos:", err);
  }

  if (!player) {
    content.innerHTML = `
      <p class="empty-state">No hemos encontrado esta jugadora.</p>
      <p style="text-align:center;"><a href="plantilla.html" class="btn btn-primary">Volver a la plantilla</a></p>`;
    return;
  }

  const pageTitle = `${player.nombre} — Fútbol Femenino Santa Ponça`;
  document.title = pageTitle;
  document.getElementById("page-title").textContent = pageTitle;
  document.getElementById("og-title").setAttribute("content", pageTitle);
  const desc = `${player.nombre}, ${player.posicion || "jugadora"}${player.dorsal != null ? " (dorsal " + player.dorsal + ")" : ""} del Fútbol Femenino Santa Ponça.`;
  document.getElementById("page-description").setAttribute("content", desc);
  document.getElementById("og-description").setAttribute("content", desc);

  const infoHtml = `
    <div class="player-profile__header">
      <span class="player-profile__number">${player.dorsal != null ? player.dorsal : "-"}</span>
      <div>
        <span class="eyebrow player-profile__pos">${player.posicion || ""}</span>
        <h1 class="player-profile__name">${player.nombre || ""}</h1>
      </div>
    </div>
    <p class="player-profile__bio">${player.bio || "Ficha de jugadora del Fútbol Femenino Santa Ponça."}</p>
    <div class="stat-strip">
      <div class="stat-item"><strong>${player.partidos_jugados != null ? player.partidos_jugados : "-"}</strong><span>Partidos jugados</span></div>
      <div class="stat-item"><strong>${player.goles != null ? player.goles : "-"}</strong><span>Goles</span></div>
      <div class="stat-item"><strong>${player.tarjetas_amarillas != null ? player.tarjetas_amarillas : "-"}</strong><span>T. amarillas</span></div>
      <div class="stat-item"><strong>${player.tarjetas_rojas != null ? player.tarjetas_rojas : "-"}</strong><span>T. rojas</span></div>
    </div>`;

  content.innerHTML = player.foto_url
    ? `<div class="player-profile--photo">
         <div class="player-profile__photo"><img src="${player.foto_url}" alt="${player.nombre}"></div>
         <div>${infoHtml}</div>
       </div>`
    : `<div style="max-width:640px;">${infoHtml}</div>`;

  const matchStats = await SPFC_DATA.playerMatchStats(player.id).catch(() => []);
  if (matchStats && matchStats.length) {
    const filas = matchStats.map((s) => {
      const m = s.matches || {};
      const fechaTexto = m.fecha ? new Date(m.fecha + "T00:00:00").toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }) : "-";
      return `<tr>
        <td>${fechaTexto}</td>
        <td>vs ${m.rival || "-"} ${m.condicion ? `(${m.condicion === "local" ? "local" : "visitante"})` : ""}</td>
        <td>${s.minutos != null ? s.minutos + "'" : "-"}</td>
        <td>${s.goles || 0}</td>
        <td>${s.tarjetas_amarillas || 0}</td>
        <td>${s.tarjetas_rojas || 0}</td>
      </tr>`;
    }).join("");
    content.insertAdjacentHTML("beforeend", `
      <table class="player-stats-table">
        <thead><tr><th>Fecha</th><th>Partido</th><th>Minutos</th><th>Goles</th><th>Amarillas</th><th>Rojas</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>`);
  }
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
