<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi carnet — Fútbol Femenino Santa Ponça</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .mc-wrap { max-width: 420px; margin: 0 auto; }
  .mc-card { background: var(--ink); color: var(--text-on-dark); border-radius: var(--radius-lg); padding: 1.8rem; text-align: center; margin-bottom: 1.4rem; }
  .mc-crest { width: 56px; height: 56px; object-fit: contain; margin-bottom: 0.6rem; }
  .mc-tipo { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-light); font-weight: 700; }
  .mc-nombre { font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; margin: 0.3rem 0; }
  .mc-numero { font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; margin: 0.6rem 0; }
  .mc-meta { font-size: 0.82rem; color: var(--text-on-dark-muted); }
  .mc-qr { background: #fff; border-radius: var(--radius-md); padding: 1rem; display: inline-block; margin: 1.2rem 0; }
  .mc-empty { color: var(--text-on-cream-muted); text-align: center; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-cuenta-->
<main id="main">
  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag">Fútbol Femenino Santa Ponça</span>
      <h1 class="hero__title">Mi carnet</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="mc-wrap">
        <div id="mc-loading">Cargando…</div>
        <div id="mc-list"></div>
      </div>
    </div>
  </section>
</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/ticketing-data.js"></script>
<script src="assets/js/qr.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  if (!window.spfc) return;
  const sesion = await SPFC_TICKETING.sesionActual();
  if (!sesion) {
    location.href = "cuenta.html?volver=" + encodeURIComponent(location.pathname);
    return;
  }

  const membresias = (await SPFC_TICKETING.misMembresias()).filter((m) => m.estado === "activa");
  const loadingEl = document.getElementById("mc-loading");
  const listEl = document.getElementById("mc-list");
  loadingEl.style.display = "none";

  if (!membresias.length) {
    listEl.innerHTML = '<p class="mc-empty">Todavía no eres socia/o ni tienes abono activo. <a href="socios.html">Hazte socia/o</a>.</p>';
    return;
  }

  listEl.innerHTML = membresias.map((m, i) => `
    <div class="mc-card">
      <img class="mc-crest" src="assets/img/escudo-santa-ponsa.png" alt="">
      <div class="mc-tipo">${m.ticket_products.tipo === "socio" ? "Socio FFSP" : "Abono de temporada"}</div>
      <div class="mc-nombre">${m.ticket_products.nombre}</div>
      <div class="mc-numero">Nº ${String(m.member_number).padStart(4, "0")}</div>
      <div class="mc-meta">${m.teams ? m.teams.nombre : "Todo el club"} · Temporada ${m.temporada}</div>
      <div class="mc-qr" id="mc-qr-${i}"></div>
      <div>
        <button type="button" class="btn btn-outline btn-sm" data-wallet="${m.id}" data-idx="${i}">Añadir a Apple Wallet</button>
      </div>
      <p id="mc-wallet-status-${i}" style="margin-top:0.6rem;font-size:0.78rem;color:var(--text-on-dark-muted);"></p>
    </div>`).join("");

  for (let i = 0; i < membresias.length; i++) {
    const token = await SPFC_TICKETING.credencialDeMembership(membresias[i].id);
    if (token) SPFC_QR.render(document.getElementById(`mc-qr-${i}`), token);
  }

  listEl.querySelectorAll("[data-wallet]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const statusEl = document.getElementById("mc-wallet-status-" + btn.dataset.idx);
      statusEl.textContent = "Generando…";
      try {
        const { data: { session } } = await window.spfc.auth.getSession();
        const res = await fetch(`/.netlify/functions/generate-wallet-pass?membership=${btn.dataset.wallet}`, {
          headers: { Authorization: "Bearer " + (session ? session.access_token : "") },
        });
        if (res.status === 501) {
          const json = await res.json();
          statusEl.textContent = json.error;
          return;
        }
        if (!res.ok) throw new Error(await res.text());
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "ffsp.pkpass";
        a.click();
        URL.revokeObjectURL(url);
        statusEl.textContent = "";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      }
    });
  });
})();
</script>
</body>
</html>
