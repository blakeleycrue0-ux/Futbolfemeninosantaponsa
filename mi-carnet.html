<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi carné — Fútbol Femenino Santa Ponça</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/ticketing.css">
<style>
  .mc-wrap { max-width: 440px; margin: 0 auto; }
  .mc-item { margin-bottom: 2rem; text-align: center; }
  .mc-item .membership-card { margin: 0 auto; text-align: left; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-cuenta-->
<main id="main" class="tk-page">
  <div class="container mc-wrap">
    <div class="tk-pagehead" style="padding-top:0;">
      <span class="tk-eyebrow">Mi carné</span>
    </div>
    <div id="mc-loading" class="tk-empty" style="margin-top:1rem;">Cargando…</div>
    <div id="mc-list" style="margin-top:1.2rem;"></div>
  </div>
</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/ticketing-data.js"></script>
<script src="assets/js/qr.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  if (!window.spfc) return;
  const sesion = await SPFC_TICKETING.sesionActual();
  if (!sesion) {
    location.href = "cuenta.html?volver=" + encodeURIComponent(location.pathname);
    return;
  }

  const nombreTitular = SPFC_TICKETING.nombreTitular(sesion.user);
  const membresias = (await SPFC_TICKETING.misMembresias()).filter((m) => m.estado === "activa");
  const loadingEl = document.getElementById("mc-loading");
  const listEl = document.getElementById("mc-list");
  loadingEl.style.display = "none";

  if (!membresias.length) {
    listEl.innerHTML = '<p class="tk-empty">Todavía no eres socia/o ni tienes abono activo. <a href="socios.html">Hazte socia/o</a>.</p>';
    return;
  }

  listEl.innerHTML = membresias.map((m, i) => `
    <div class="mc-item">
      ${SPFC_TICKETING.membershipCardHTML(m, nombreTitular, i)}
      <p class="mc-flip-hint">Toca la tarjeta para ver tu código de acceso</p>
    </div>`).join("");

  const tokens = await Promise.all(membresias.map((m) => SPFC_TICKETING.credencialDeMembership(m.id)));

  listEl.querySelectorAll("[data-card]").forEach((card, i) => {
    function voltear() {
      const abriendo = !card.classList.contains("is-flipped");
      card.classList.toggle("is-flipped", abriendo);
      card.setAttribute("aria-pressed", String(abriendo));
      if (abriendo && !card.dataset.rendered && tokens[i]) {
        SPFC_QR.render(card.querySelector("[data-qr-box]"), tokens[i]);
        card.dataset.rendered = "1";
      }
    }
    card.addEventListener("click", voltear);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); voltear(); }
    });
  });
})();
</script>
</body>
</html>
