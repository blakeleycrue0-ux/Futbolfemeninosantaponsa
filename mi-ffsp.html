<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi FFSP — Fútbol Femenino Santa Ponça</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/ticketing.css">
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-cuenta-->
<main id="main" class="tk-page">
  <div class="container" style="max-width:560px;">
    <div id="mf-loading" class="tk-empty">Cargando…</div>

    <div id="mf-content" style="display:none;">
      <h1 class="hub-greeting" id="mf-saludo">Hola.</h1>

      <div class="hub-section" id="mf-carnet-section" style="display:none;">
        <div id="mf-carnet-module"></div>
      </div>

      <div class="hub-section" id="mf-proximo-section" style="display:none;">
        <div class="hub-section__head"><h2>Próximo en casa</h2></div>
        <div class="hub-row" id="mf-proximo-row"></div>
      </div>

      <div class="hub-section">
        <div class="hub-section__head"><h2>Mis entradas</h2></div>
        <div id="mf-entradas"></div>
      </div>

      <div class="hub-section">
        <div class="hub-section__head"><h2>Historial</h2></div>
        <div id="mf-pedidos" style="opacity:0.7;"></div>
      </div>
    </div>
  </div>
</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/ticketing-data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  if (!window.spfc) return;
  const sesion = await SPFC_TICKETING.sesionActual();
  if (!sesion) {
    location.href = "cuenta.html?volver=" + encodeURIComponent(location.pathname);
    return;
  }

  const esc = SPFC_TICKETING.escapeHtml;
  const nombreTitular = SPFC_TICKETING.nombreTitular(sesion.user);
  document.getElementById("mf-saludo").textContent = "Hola, " + nombreTitular.split("@")[0].split(" ")[0] + ".";

  const [membresias, entradas, pedidos] = await Promise.all([
    SPFC_TICKETING.misMembresias(),
    SPFC_TICKETING.misEntradas(),
    SPFC_TICKETING.misPedidos(),
  ]);

  const activa = membresias.find((m) => m.estado === "activa");
  if (activa) {
    document.getElementById("mf-carnet-section").style.display = "block";
    document.getElementById("mf-carnet-module").innerHTML = SPFC_TICKETING.carnetModuleHTML({
      nombre: nombreTitular,
      numero: activa.member_number,
      temporada: (activa.temporada || "").replace("20", ""),
    });

    const proximo = await SPFC_TICKETING.proximoPartidoElegible(activa);
    if (proximo) {
      document.getElementById("mf-proximo-section").style.display = "block";
      document.getElementById("mf-proximo-row").innerHTML = `
        <div>
          <div class="hub-row__title">FFSP <span style="color:var(--text-on-cream-muted);font-weight:400;">vs</span> ${esc(proximo.rival)}</div>
          <div class="hub-row__meta">${esc(SPFC_TICKETING.fmtFecha(proximo.fecha))}${proximo.hora ? " · " + esc(proximo.hora.slice(0, 5)) + "h" : ""}</div>
        </div>`;
    }
  }

  const eEl = document.getElementById("mf-entradas");
  const ahora = new Date();
  const proximasEntradas = entradas.filter((t) => t.matches && new Date(t.matches.fecha) >= ahora && t.estado === "valido");
  eEl.innerHTML = proximasEntradas.length ? proximasEntradas.map((t) => `
    <a class="hub-row" href="entrada.html?id=${t.id}" style="text-decoration:none;color:inherit;">
      <div>
        <div class="hub-row__title">vs ${esc(t.matches.rival)}</div>
        <div class="hub-row__meta">${esc(SPFC_TICKETING.fmtFecha(t.matches.fecha))}${t.matches.hora ? " · " + esc(t.matches.hora.slice(0, 5)) + "h" : ""}</div>
      </div>
      <span class="fixture-row__cta">Ver →</span>
    </a>`).join("") : `<p class="tk-empty">Todavía no tienes entradas. <a href="entradas.html">Comprar entradas</a>.</p>`;

  const pEl = document.getElementById("mf-pedidos");
  pEl.innerHTML = pedidos.length ? pedidos.map((o) => `
    <div class="hub-row hub-row--muted">
      <div>
        <div class="hub-row__title">${esc(o.ticket_products.nombre)}</div>
        <div class="hub-row__meta">${esc(new Date(o.creado_en).toLocaleDateString("es-ES"))} · ${SPFC_TICKETING.fmtEuros(o.importe)}</div>
      </div>
      <span class="hub-row__meta">${esc(o.estado)}</span>
    </div>`).join("") : '<p class="tk-empty">Todavía no has hecho ningún pedido.</p>';

  document.getElementById("mf-loading").style.display = "none";
  document.getElementById("mf-content").style.display = "block";
})();
</script>
</body>
</html>
