[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Sincronización FFIB por cron — no en cada visita.
# Ajusta la frecuencia según cuántas veces por día se juegan/actualizan
# resultados en la competición (cada 6h es un punto de partida razonable).
[functions."ffib-sync"]
  schedule = "0 */6 * * *"

# Recordatorios automáticos de pago (un día antes del vencimiento de cada
# cuota) — se ejecuta sola cada mañana, nadie del club tiene que enviarlos.
[functions."payment-reminders"]
  schedule = "0 8 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/api/ffib-sync"
  to = "/.netlify/functions/ffib-sync"
  status = 200

# Fuerza HTTPS siempre — por si alguien llega por un enlace o marcador
# antiguo en http:// (Chrome avisa de "no seguro" en formularios servidos
# así). Cinturón de seguridad además de la config de dominio de Netlify.
[[redirects]]
  from = "http://ffsp.info/*"
  to = "https://ffsp.info/:splat"
  status = 301
  force = true

# ─── MODO MANTENIMIENTO (ACTIVO) ───
# Para desactivarlo: vuelve a comentar todo este bloque (o bórralo) y
# push a main. El panel de admin y las funciones siguen funcionando con
# normalidad mientras tanto.

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/mantenimiento.html"
  to = "/mantenimiento.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/mantenimiento.html"
  status = 200
  force = true
