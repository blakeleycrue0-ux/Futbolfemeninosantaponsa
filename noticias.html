<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias — Fútbol Femenino Santa Ponça</title>
<meta name="description" content="Toda la actualidad del Fútbol Femenino Santa Ponça: crónicas de partidos, novedades del club, cantera y avisos para socias y aficionados.">
<link rel="canonical" href="https://futbolfemeninosantaponsa.netlify.app/noticias.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Noticias — Fútbol Femenino Santa Ponça">
<meta property="og:description" content="Toda la actualidad del club: crónicas, novedades y avisos.">
<meta property="og:url" content="https://futbolfemeninosantaponsa.netlify.app/noticias.html">
<meta property="og:locale" content="es_ES">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .filters-bar .search-field { flex: 1 1 280px; }
  .filters-bar .search-field input { width: 100%; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">

  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag">Club Fútbol Femenino Santa Ponça</span>
      <h1 class="hero__title">Noticias</h1>
    </div>
  </section>

  <section class="section" aria-labelledby="noticias-heading">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Actualidad</span>
          <h2 id="noticias-heading">Últimas noticias</h2>
        </div>
      </div>
      <div class="filters-bar">
        <div class="search-field">
          <input type="search" id="noticias-search" placeholder="Buscar noticias por título o resumen…" aria-label="Buscar noticias">
        </div>
      </div>
      <div id="noticias-lead" class="news-grid-v2"></div>
      <div id="noticias-rest" class="news-row-list"></div>
      <p id="noticias-empty" class="empty-state" style="display:none;"></p>
    </div>
  </section>

</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  const leadGrid = document.getElementById("noticias-lead");
  const restList = document.getElementById("noticias-rest");
  const emptyState = document.getElementById("noticias-empty");
  const searchInput = document.getElementById("noticias-search");
  let allNews = [];

  // Composición editorial: la más reciente de las tres primeras queda de
  // protagonista, dos secundarias al lado (.news-grid-v2/.nc, igual que la
  // portada), y el resto en una lista compacta — nada de repetir la misma
  // tarjeta diez veces.
  function renderNews(list) {
    if (!list.length) {
      leadGrid.innerHTML = "";
      restList.innerHTML = "";
      emptyState.textContent = "No se han encontrado noticias.";
      emptyState.style.display = "";
      return;
    }
    emptyState.style.display = "none";

    const destacadas = list.slice(0, 3);
    const resto = list.slice(3);

    leadGrid.innerHTML = destacadas.map((n) => `
      <a class="nc" href="noticia.html?id=${encodeURIComponent(n.id)}">
        <span class="nc-gate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="11" width="16" height="9" rx="1.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Exclusivo socias</span>
        ${n.imagen_url
          ? `<img class="nc-img" src="${escapeHtml(n.imagen_url)}" alt="${escapeHtml(n.titulo)}" loading="lazy">`
          : `<div class="nc-img nc-img-fallback"><img src="assets/img/escudo-santa-ponsa.png" alt=""></div>`}
        <div class="nc-body">
          <span class="nc-eq">${escapeHtml(spfcFormatDate(n.fecha))}</span>
          <div class="nc-title">${escapeHtml(n.titulo)}</div>
          <div class="nc-desc">${escapeHtml(n.resumen || "")}</div>
        </div>
      </a>`).join("");

    restList.innerHTML = resto.map((n) => `
      <a class="news-row" href="noticia.html?id=${encodeURIComponent(n.id)}">
        <span class="news-row__title">${escapeHtml(n.titulo)}</span>
        <span class="news-row__date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="4" y="11" width="16" height="9" rx="1.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>${escapeHtml(spfcFormatDate(n.fecha))}</span>
      </a>`).join("");
  }

  allNews = await SPFC_DATA.news(50);

  if (!allNews.length) {
    leadGrid.innerHTML = "";
    restList.innerHTML = "";
    emptyState.textContent = "Todavía no hay noticias publicadas. Vuelve pronto para conocer la actualidad del club.";
    emptyState.style.display = "";
  } else {
    renderNews(allNews);
  }

  searchInput.addEventListener("input", function () {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      renderNews(allNews);
      return;
    }
    const filtered = allNews.filter((n) =>
      (n.titulo || "").toLowerCase().includes(q) || (n.resumen || "").toLowerCase().includes(q)
    );
    renderNews(filtered);
  });
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
