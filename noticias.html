<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias — Fútbol Femenino Santa Ponça</title>
<meta name="description" content="Toda la actualidad del Fútbol Femenino Santa Ponça: crónicas de partidos, novedades del club, cantera y avisos para socias y aficionados.">
<link rel="canonical" href="https://futbolfemeninosantaponsa.netlify.app/noticias.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Noticias — Fútbol Femenino Santa Ponça">
<meta property="og:description" content="Toda la actualidad del club: crónicas, novedades y avisos.">
<meta property="og:url" content="https://futbolfemeninosantaponsa.netlify.app/noticias.html">
<meta property="og:locale" content="es_ES">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .noticias-empty { grid-column: 1/-1; }
  .filters-bar .search-field { flex: 1 1 280px; }
  .filters-bar .search-field input { width: 100%; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">

  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag">Club Fútbol Femenino Santa Ponça</span>
      <h1 class="hero__title">Noticias</h1>
    </div>
  </section>

  <section class="section" aria-labelledby="noticias-heading">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Actualidad</span>
          <h2 id="noticias-heading">Últimas noticias</h2>
        </div>
      </div>
      <div class="filters-bar">
        <div class="search-field">
          <input type="search" id="noticias-search" placeholder="Buscar noticias por título o resumen…" aria-label="Buscar noticias">
        </div>
      </div>
      <div id="noticias-grid" class="grid grid-3">
        <p class="empty-state noticias-empty">Cargando noticias…</p>
      </div>
    </div>
  </section>

</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  const grid = document.getElementById("noticias-grid");
  const searchInput = document.getElementById("noticias-search");
  let allNews = [];

  function renderNews(list) {
    if (!list.length) {
      grid.innerHTML = `<p class="empty-state noticias-empty">No se han encontrado noticias.</p>`;
      return;
    }
    grid.innerHTML = list.map((n) => `
      <a href="noticia.html?id=${encodeURIComponent(n.id)}" class="card">
        <div class="card__media">${n.imagen_url ? `<img src="${escapeHtml(n.imagen_url)}" alt="${escapeHtml(n.titulo)}" loading="lazy">` : ""}</div>
        <div class="card__body">
          <span class="card__tag">${escapeHtml(spfcFormatDate(n.fecha))}</span>
          <h3 class="card__title">${escapeHtml(n.titulo)}</h3>
          <p class="card__meta">${escapeHtml(n.resumen || "")}</p>
        </div>
      </a>`).join("");
  }

  allNews = await SPFC_DATA.news(50);

  if (!allNews.length) {
    grid.innerHTML = `<p class="empty-state noticias-empty">Todavía no hay noticias publicadas. Vuelve pronto para conocer la actualidad del club.</p>`;
  } else {
    renderNews(allNews);
  }

  searchInput.addEventListener("input", function () {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      renderNews(allNews);
      return;
    }
    const filtered = allNews.filter((n) =>
      (n.titulo || "").toLowerCase().includes(q) || (n.resumen || "").toLowerCase().includes(q)
    );
    renderNews(filtered);
  });
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
