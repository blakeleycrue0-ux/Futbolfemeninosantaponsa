<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partido — Fútbol Femenino Santa Ponça</title>
<meta name="description" content="Ficha del partido del Fútbol Femenino Santa Ponça: resultado, crónica, vídeo y estadísticas.">
<link rel="canonical" href="https://futbolfemeninosantaponsa.netlify.app/partido.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Partido — Fútbol Femenino Santa Ponça">
<meta property="og:description" content="Resultado, crónica, vídeo y estadísticas del partido.">
<meta property="og:url" content="https://futbolfemeninosantaponsa.netlify.app/partido.html">
<meta property="og:locale" content="es_ES">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .match-hero { max-width: 660px; margin: 0 auto; padding: 2.4rem 2rem; }
  .match-hero .match-card__comp { display: block; text-align: center; margin-bottom: 0.6rem; }
  .match-hero .match-team__crest { width: 84px; height: 84px; font-size: 1.4rem; }
  .match-hero .match-team__name { font-size: 1rem; }
  .match-hero .match-card__score { font-size: 2.6rem; }
  #cronica-content p { color: var(--text-on-cream); line-height: 1.75; }
  #gallery-grid a.card { display: block; }
  #gallery-grid .card__media { aspect-ratio: 1; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">

  <section class="section section-dark" style="padding-top:7.5rem;padding-bottom:2.6rem;">
    <div class="container">
      <nav class="breadcrumb" style="margin-bottom:2rem;">
        <a href="index.html">Inicio</a>
        <span>/</span>
        <a href="calendario.html">Calendario</a>
        <span>/</span>
        <span id="breadcrumb-current">Partido</span>
      </nav>
      <div id="match-header">
        <p class="empty-state" style="color:var(--text-on-dark-muted);">Cargando partido…</p>
      </div>
    </div>
  </section>

  <div id="match-body" style="display:none;">

    <section class="section" aria-labelledby="cronica-heading">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Después del pitido final</span>
            <h2 id="cronica-heading">Crónica</h2>
          </div>
        </div>
        <div id="cronica-content"></div>
      </div>
    </section>

    <section class="section section-dark" id="video-section" style="display:none;" aria-labelledby="video-heading">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Repite las jugadas</span>
            <h2 id="video-heading">Vídeo del partido</h2>
          </div>
        </div>
        <div id="video-wrap"></div>
      </div>
    </section>

    <section class="section" aria-labelledby="stats-heading">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Datos del partido</span>
            <h2 id="stats-heading">Estadísticas</h2>
          </div>
        </div>
        <div id="stats-strip" class="stat-strip"></div>
      </div>
    </section>

    <section class="section section-dark" id="gallery-section" style="display:none;" aria-labelledby="gallery-heading">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Momentos del partido</span>
            <h2 id="gallery-heading">Galería</h2>
          </div>
          <a href="galeria.html" class="back-link" style="margin:0;color:var(--accent-light);">Ver galería completa →</a>
        </div>
        <div id="gallery-grid" class="grid grid-4"></div>
      </div>
    </section>

  </div>

</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/socios-gate.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  const headerEl = document.getElementById("match-header");
  const bodyEl = document.getElementById("match-body");
  const breadcrumbCurrent = document.getElementById("breadcrumb-current");

  function extractYouTubeId(url) {
    if (!url) return null;
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]{6,})/,
      /(?:youtu\.be\/)([\w-]{6,})/,
      /(?:youtube\.com\/embed\/)([\w-]{6,})/,
    ];
    for (const re of patterns) {
      const m = url.match(re);
      if (m) return m[1];
    }
    return null;
  }

  function setMeta(selector, value) {
    const el = document.querySelector(selector);
    if (el) el.setAttribute("content", value);
  }

  function showNotFound(message) {
    breadcrumbCurrent.textContent = "Partido no encontrado";
    headerEl.innerHTML = `
      <div style="text-align:center;padding:2.5rem 0;">
        <p class="empty-state" style="color:var(--text-on-dark-muted);">${message}</p>
        <a href="calendario.html" class="btn btn-primary">Volver al calendario</a>
      </div>`;
    document.title = "Partido no encontrado — Fútbol Femenino Santa Ponça";
  }

  const id = new URLSearchParams(location.search).get("id");

  if (!id) {
    showNotFound("Falta indicar qué partido quieres consultar.");
    return;
  }

  let match = null;
  try {
    match = await SPFC_DATA.matchById(id);
  } catch (err) {
    console.warn("[partido] error cargando partido:", err);
  }

  if (!match) {
    showNotFound("No hemos encontrado este partido. Puede que el enlace sea incorrecto o que ya no esté disponible.");
    return;
  }

  const esLocal = match.condicion === "local";
  const jugado = match.estado === "jugado";
  const rivalName = match.rival || "Rival";

  breadcrumbCurrent.textContent = `Santa Ponça vs ${rivalName}`;

  headerEl.innerHTML = spfcMatchProtagonistHTML(match);

  const resultLine = jugado
    ? `${esLocal ? match.goles_equipo : match.goles_rival}-${esLocal ? match.goles_rival : match.goles_equipo}`
    : spfcFormatDate(match.fecha);
  document.title = `Santa Ponça vs ${rivalName} (${resultLine}) — Fútbol Femenino Santa Ponça`;
  setMeta('meta[property="og:title"]', `Santa Ponça vs ${rivalName}`);
  setMeta('meta[property="og:description"]', jugado
    ? `Resultado: ${esLocal ? match.goles_equipo : match.goles_rival} — ${esLocal ? match.goles_rival : match.goles_equipo}. ${match.competicion || ""}`
    : `Partido programado el ${spfcFormatDate(match.fecha)}. ${match.competicion || ""}`);

  bodyEl.style.display = "";

  const cronicaEl = document.getElementById("cronica-content");
  if (match.cronica && match.cronica.trim()) {
    cronicaEl.innerHTML = match.cronica.split(/\n+/).filter(Boolean).map((p) => `<p>${p}</p>`).join("");
  } else {
    cronicaEl.innerHTML = `<p class="empty-state">La crónica de este partido se publicará después de disputarse.</p>`;
  }

  const videoUrls = [match.video_url, match.video_url_2].filter(Boolean);
  if (videoUrls.length) {
    const videoSection = document.getElementById("video-section");
    const videoWrap = document.getElementById("video-wrap");
    const dentroVideo = await SPFC_SOCIOS.haySesion();

    if (!dentroVideo) {
      videoWrap.style.display = "block";
      videoWrap.innerHTML = SPFC_SOCIOS.candado("Inicia sesión para ver el vídeo del partido.");
      SPFC_SOCIOS.mostrarModal("Inicia sesión para ver el vídeo del partido.");
    } else {
      videoWrap.style.display = videoUrls.length > 1 ? "grid" : "block";
      if (videoUrls.length > 1) {
        videoWrap.style.gridTemplateColumns = "repeat(auto-fit, minmax(280px, 1fr))";
        videoWrap.style.gap = "1.2rem";
      }
      videoWrap.innerHTML = videoUrls.map((url) => {
        const ytId = extractYouTubeId(url);
        const src = ytId ? `https://www.youtube.com/embed/${ytId}` : url;
        return `
          <div style="position:relative;aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;background:#000;">
            <iframe src="${src}" title="Vídeo del partido" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
          </div>`;
      }).join("");
    }
    videoSection.style.display = "";
  }

  const stats = [];
  if (jugado) {
    stats.push({ value: match.goles_equipo != null ? match.goles_equipo : "-", label: "Goles Santa Ponça" });
    stats.push({ value: match.goles_rival != null ? match.goles_rival : "-", label: "Goles " + rivalName });
  }
  stats.push({ value: esLocal ? "Local" : "Visitante", label: "Condición" });
  if (match.jornada) stats.push({ value: match.jornada, label: "Jornada" });
  if (match.campo) stats.push({ value: match.campo, label: "Campo" });
  if (match.competicion) stats.push({ value: match.competicion, label: "Competición" });

  document.getElementById("stats-strip").innerHTML = stats.slice(0, 4).map((s) => {
    const long = typeof s.value === "string" && s.value.length > 12;
    return `<div class="stat-item"><strong${long ? ' style="font-size:1.15rem;"' : ""}>${s.value}</strong><span>${s.label}</span></div>`;
  }).join("");

  try {
    const items = await SPFC_DATA.gallery(match.id);
    if (items && items.length) {
      const gallerySection = document.getElementById("gallery-section");
      const galleryGrid = document.getElementById("gallery-grid");
      galleryGrid.innerHTML = items.slice(0, 8).map((it) => {
        const isVideo = it.tipo === "video";
        return `
        <a href="galeria.html" class="card">
          <div class="card__media">
            ${!isVideo && it.url ? `<img src="${it.url}" alt="${it.descripcion || "Foto del partido"}" loading="lazy">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--accent-dark);font-size:0.75rem;">${isVideo ? "Vídeo" : "Foto"}</div>`}
          </div>
        </a>`;
      }).join("");
      gallerySection.style.display = "";
    }
  } catch (err) {
    console.warn("[partido] error cargando galería:", err);
  }
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
