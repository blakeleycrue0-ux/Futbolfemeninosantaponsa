<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantilla — Fútbol Femenino Santa Ponça</title>
<meta name="description" content="Plantilla del Fútbol Femenino Santa Ponça: jugadoras, dorsales, posiciones y estadísticas de la temporada.">
<link rel="canonical" href="https://futbolfemeninosantaponsa.netlify.app/plantilla.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Plantilla — Fútbol Femenino Santa Ponça">
<meta property="og:description" content="Jugadoras, dorsales, posiciones y estadísticas de la temporada.">
<meta property="og:url" content="https://futbolfemeninosantaponsa.netlify.app/plantilla.html">
<meta property="og:locale" content="es_ES">
<meta name="theme-color" content="#17151b">
<link rel="icon" type="image/png" href="assets/img/escudo-santa-ponsa.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png?v=2">
<script src="assets/js/ga4.js"></script>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .player-card { display: block; }
  .player-card__pj { font-size: 0.75rem; color: var(--text-on-dark-muted); margin-top: 0.3em; }
  .filters-bar label { font-size: 0.8rem; font-weight: 600; align-self: center; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Saltar al contenido</a>

<!--#include header-->
<main id="main">

  <section class="hero hero--sub">
    <div class="hero__media" aria-hidden="true"></div>
    <div class="container hero__content">
      <span class="hero__tag" id="plantilla-eyebrow">Plantilla</span>
      <h1 class="hero__title" id="plantilla-title">Cargando equipo…</h1>
    </div>
  </section>

  <section class="section" aria-labelledby="plantilla-heading">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Jugadoras</span>
          <h2 id="plantilla-heading">Plantilla completa</h2>
        </div>
        <a href="equipos.html" class="back-link" style="margin:0;">← Ver todos los equipos</a>
      </div>

      <div class="filters-bar">
        <label for="filtro-posicion">Posición</label>
        <select id="filtro-posicion">
          <option value="">Todas</option>
          <option value="Portera">Portera</option>
          <option value="Defensa">Defensa</option>
          <option value="Centrocampista">Centrocampista</option>
          <option value="Delantera">Delantera</option>
        </select>
      </div>

      <div id="plantilla-grid" class="grid grid-4">
        <p class="empty-state">Cargando plantilla…</p>
      </div>
    </div>
  </section>

</main>

<!--#include footer-->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/mantenimiento-check.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/nav.js"></script>
<script>
(async function () {
  let players = [];

  function renderPlayers(list) {
    const grid = document.getElementById("plantilla-grid");
    if (!list.length) {
      grid.innerHTML = `<p class="empty-state" style="grid-column:1/-1;">No hay jugadoras que coincidan con este filtro.</p>`;
      return;
    }
    grid.innerHTML = list.map((p) => `
      <a href="jugadora.html?id=${encodeURIComponent(p.id)}" class="player-card">
        ${p.foto_url
          ? `<img class="player-card__photo" src="${p.foto_url}" alt="">`
          : `<span class="player-card__photo player-card__photo--sin-foto" aria-hidden="true">${(p.nombre || "?").trim().charAt(0).toUpperCase()}</span>`}
        <div class="player-card__top">
          <span class="player-card__number">${p.dorsal != null ? p.dorsal : "-"}</span>
          <span class="player-card__pos">${p.posicion || ""}</span>
        </div>
        <h3 class="player-card__name">${p.nombre || ""}</h3>
        <p class="player-card__pj">${p.partidos_jugados != null ? p.partidos_jugados + " PJ" : ""}${p.goles != null ? " · " + p.goles + " goles" : ""}</p>
      </a>`).join("");
  }

  try {
    let teamId = new URLSearchParams(location.search).get("team");
    let teamInfo = null;

    const teams = await SPFC_DATA.teams();

    if (teamId) {
      teamInfo = (teams || []).find((t) => t.id === teamId) || null;
    } else if (teams && teams.length) {
      teamInfo = teams[0];
      teamId = teamInfo.id;
    }

    document.getElementById("plantilla-eyebrow").textContent = teamInfo ? (teamInfo.categoria || "Plantilla") : "Plantilla";
    document.getElementById("plantilla-title").textContent = teamInfo ? teamInfo.nombre : "Plantilla";
    document.title = (teamInfo ? teamInfo.nombre + " — Plantilla" : "Plantilla") + " — Fútbol Femenino Santa Ponça";

    if (!teamId) {
      document.getElementById("plantilla-grid").innerHTML = `<p class="empty-state" style="grid-column:1/-1;">Todavía no hay equipos publicados.</p>`;
      return;
    }

    players = await SPFC_DATA.players(teamId);
    renderPlayers(players);

    document.getElementById("filtro-posicion").addEventListener("change", (e) => {
      const pos = e.target.value;
      renderPlayers(pos ? players.filter((p) => p.posicion === pos) : players);
    });
  } catch (err) {
    console.warn("[plantilla] error cargando datos:", err);
    document.getElementById("plantilla-grid").innerHTML = `<p class="empty-state" style="grid-column:1/-1;">No se ha podido cargar la plantilla.</p>`;
  }
})();
</script>
<script src="assets/js/search.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
</body>
</html>
