<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de acceso — Elige partido</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
  body.admin { background: var(--ink); }
  .st-wrap { max-width: 560px; margin: 0 auto; padding: 2rem 1rem; }
  .st-top { display: flex; justify-content: space-between; align-items: center; color: var(--text-on-dark); margin-bottom: 1.4rem; }
  .st-match { background: var(--paper); border-radius: var(--radius-lg); padding: 1.2rem 1.4rem; margin-bottom: 0.9rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .st-match-rival { font-family: var(--font-display); font-weight: 800; }
  .st-match-meta { font-size: 0.82rem; color: var(--text-on-cream-muted); }
  .st-empty { color: var(--text-on-dark-muted); text-align: center; }
</style>
</head>
<body class="admin">
<div class="st-wrap">
  <div class="st-top">
    <strong>Control de acceso</strong>
    <div>
      <span data-admin-email style="font-size:0.8rem;margin-right:0.6rem;">—</span>
      <button class="btn btn-ghost-light btn-sm" data-logout type="button">Salir</button>
    </div>
  </div>
  <p style="color:var(--text-on-dark-muted);font-size:0.85rem;margin-bottom:1rem;">Elige el partido para el que vas a controlar el acceso.</p>
  <div id="st-list"><p class="st-empty">Cargando…</p></div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="js/staff-auth.js"></script>
<script>
(async function () {
  if (!window.spfc) return;
  const listEl = document.getElementById("st-list");
  const hoy = new Date();
  hoy.setDate(hoy.getDate() - 1);
  const { data, error } = await window.spfc
    .from("matches")
    .select("id, rival, fecha, hora, condicion, teams(nombre)")
    .eq("condicion", "local")
    .gte("fecha", hoy.toISOString().slice(0, 10))
    .order("fecha", { ascending: true })
    .limit(15);
  if (error) { listEl.innerHTML = `<p class="st-empty">Error: ${error.message}</p>`; return; }
  if (!data || !data.length) { listEl.innerHTML = '<p class="st-empty">No hay partidos en casa próximamente.</p>'; return; }
  listEl.innerHTML = data.map((m) => `
    <div class="st-match">
      <div>
        <div class="st-match-rival">vs ${m.rival}</div>
        <div class="st-match-meta">${new Date(m.fecha).toLocaleDateString("es-ES", { weekday: "long", day: "2-digit", month: "long" })}${m.hora ? " · " + m.hora.slice(0, 5) + "h" : ""} · ${m.teams ? m.teams.nombre : ""}</div>
      </div>
      <a class="btn btn-primary btn-sm" href="acceso.html?match=${m.id}">Usar</a>
    </div>`).join("");
})();
</script>
</body>
</html>
