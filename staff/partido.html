<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modo partido — Control de acceso</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/ticketing.css">
<link rel="stylesheet" href="../assets/css/staff.css">
</head>
<body style="background:var(--ink);">
<div class="staff-shell">
  <div class="staff-topbar">
    <strong style="color:#fff;">Control de acceso</strong>
    <div><span data-admin-email style="font-size:0.78rem;color:rgba(244,240,232,0.5);margin-right:0.8rem;">—</span><button type="button" data-logout>Salir</button></div>
  </div>

  <!-- Lista para elegir partido -->
  <div id="st-picker">
    <p class="staff-section-title">Elige el partido</p>
    <div id="st-list"><p class="staff-empty">Cargando…</p></div>
  </div>

  <!-- Modo partido: un partido concreto -->
  <div id="st-modo" style="display:none;">
    <div class="staff-fixture">
      <div class="staff-fixture__teams">FFSP<span class="vs">vs</span><span id="mp-rival"></span></div>
      <div class="staff-fixture__when" id="mp-when"></div>
    </div>
    <div class="staff-stats">
      <div class="staff-stat">
        <div class="staff-stat__value" id="mp-entradas">—</div>
        <div class="staff-stat__label">Entradas</div>
      </div>
      <div class="staff-stat">
        <div class="staff-stat__value" id="mp-dentro">—</div>
        <div class="staff-stat__label">Dentro</div>
      </div>
    </div>
    <div class="staff-actions">
      <a class="staff-action staff-action--primary" id="mp-escanear-link" href="#">
        <span class="staff-action__icon">▣</span> Escanear
      </a>
      <a class="staff-action" id="mp-buscar-link" href="#">
        <span class="staff-action__icon">⌕</span>
        <span>Buscar persona<span class="staff-action__sub">Alta manual si el QR falla</span></span>
      </a>
      <a class="staff-action" id="mp-accesos-link" href="#">
        <span class="staff-action__icon">≡</span>
        <span>Ver últimos accesos<span class="staff-action__sub">Historial completo de este partido</span></span>
      </a>
    </div>
    <button type="button" class="staff-row-btn" style="color:rgba(244,240,232,0.5);font-size:0.82rem;" id="mp-cambiar">← Cambiar de partido</button>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="js/staff-auth.js"></script>
<script>
(async function () {
  if (!window.spfc) return;

  function fmtFecha(f) {
    return f ? new Date(f).toLocaleDateString("es-ES", { weekday: "long", day: "2-digit", month: "long" }) : "";
  }
  function esHoy(f) {
    return f === new Date().toISOString().slice(0, 10);
  }

  const { data: matches } = await window.spfc
    .from("matches")
    .select("id, rival, fecha, hora, teams(nombre)")
    .eq("condicion", "local")
    .gte("fecha", new Date(Date.now() - 86400000).toISOString().slice(0, 10))
    .order("fecha", { ascending: true })
    .limit(15);

  const picker = document.getElementById("st-picker");
  const modo = document.getElementById("st-modo");
  const params = new URLSearchParams(location.search);
  const matchId = params.get("id");

  function mostrarPicker() {
    modo.style.display = "none";
    picker.style.display = "block";
    const listEl = document.getElementById("st-list");
    if (!matches || !matches.length) { listEl.innerHTML = '<p class="staff-empty">No hay partidos en casa próximamente.</p>'; return; }
    listEl.innerHTML = matches.map((m) => `
      <button type="button" class="staff-row-btn staff-row" data-id="${m.id}">
        <div>
          <div class="staff-row__title">${esHoy(m.fecha) ? "HOY" : fmtFecha(m.fecha)} ${m.hora ? "· " + m.hora.slice(0, 5) : ""}</div>
          <div class="staff-row__meta">vs ${m.rival} ${m.teams ? "· " + m.teams.nombre : ""}</div>
        </div>
        <span style="color:var(--accent-light);">→</span>
      </button>`).join("");
    listEl.querySelectorAll("[data-id]").forEach((btn) => btn.addEventListener("click", () => {
      history.pushState(null, "", "partido.html?id=" + btn.dataset.id);
      mostrarModo(btn.dataset.id);
    }));
  }

  async function mostrarModo(id) {
    const match = (matches || []).find((m) => m.id === id);
    picker.style.display = "none";
    modo.style.display = "block";
    document.getElementById("mp-rival").textContent = match ? match.rival : "";
    document.getElementById("mp-when").textContent = match ? ((esHoy(match.fecha) ? "Hoy" : fmtFecha(match.fecha)) + (match.hora ? " · " + match.hora.slice(0, 5) : "")) : "";
    document.getElementById("mp-escanear-link").href = "acceso.html?match=" + id;
    document.getElementById("mp-buscar-link").href = "buscar.html?match=" + id;
    document.getElementById("mp-accesos-link").href = "accesos.html?match=" + id;

    const [{ data: productos }, { count: dentro }] = await Promise.all([
      window.spfc.from("ticket_products").select("capacity, capacity_sold").eq("match_id", id),
      window.spfc.from("match_access_log").select("id", { count: "exact", head: true }).eq("match_id", id).eq("reversed", false),
    ]);
    const cap = (productos || []).reduce((acc, p) => (p.capacity != null ? acc + p.capacity : acc), 0);
    const sold = (productos || []).reduce((acc, p) => acc + (p.capacity_sold || 0), 0);
    document.getElementById("mp-entradas").textContent = cap > 0 ? `${sold} / ${cap}` : String(sold);
    document.getElementById("mp-dentro").textContent = String(dentro || 0);
  }

  document.getElementById("mp-cambiar").addEventListener("click", () => {
    history.pushState(null, "", "partido.html");
    mostrarPicker();
  });

  if (matchId) mostrarModo(matchId);
  else mostrarPicker();
})();
</script>
</body>
</html>
